function coopMenu(){const nm=localStorage.getItem('twinstar-name')||'';
 modal('CO-OP PLAY',`<label class="phV-l">NAME</label><input class="phV-in" id="phVn" maxlength="8" placeholder="닉네임" value="${esc(nm)}">
  <button class="phV-b" id="phVh">CREATE ROOM</button><div class="phV-or">OR JOIN WITH CODE</div>
  <div class="phV-row"><input class="phV-in code" id="phVc" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off"><button class="phV-b" id="phVj">JOIN</button></div>`);
 const ci=$('phVc');ci.oninput=()=>{const p=ci.selectionStart;ci.value=ci.value.toUpperCase();try{ci.setSelectionRange(p,p)}catch(e){}};
 const ok=()=>{const v=$('phVn').value.trim().slice(0,8);if(!v){$('phVn').classList.add('warn');$('phVn').focus();return false}localStorage.setItem('twinstar-name',v);return true};
 $('phVh').onclick=()=>{if(ok())hostRoom()};$('phVj').onclick=()=>{if(!ok())return;const c=ci.value.trim().toUpperCase();if(c.length!==4){ci.focus();return}joinRoom(c)}}
function hostRoom(){leaveCoop(true);const code=code4();coop={host:true,code,name:localStorage.getItem('twinstar-name')};modal('CREATING','<p class="phV-m">잠시만요…</p>');
 coop.peer=PHRelay.host('twinstar',code,{onReady:()=>modal('ROOM CODE',`<div class="phV-code">${code}</div><p class="phV-m">친구에게 이 코드를 알려 주세요.<br>친구가 들어오면 난이도를 골라요.</p><div class="phV-dots"><i></i><i></i><i></i></div>`),onConn:c=>setup(c),onError:fail})}
function joinRoom(code){leaveCoop(true);coop={host:false,code,name:localStorage.getItem('twinstar-name')};modal('CONNECTING',`<div class="phV-code">${esc(code)}</div><p class="phV-m">방에 들어가는 중…</p>`);
 coop.peer=PHRelay.join('twinstar',code,{onConn:c=>setup(c),onError:fail})}
function fail(t){const msg=t==='nofound'?'그 코드의 방을 찾을 수 없어요.<br>코드를 다시 확인해 주세요.':'연결 서버에 접속하지 못했어요.<br>잠시 후 다시 해 주세요.';leaveCoop(true);
 modal('WOOPS!',`<p class="phV-m">${msg}</p><button class="phV-b" id="phVr">RETRY</button>`);$('phVr').onclick=coopMenu}
function setup(c){coop.conn=c;c.on('open',()=>{send({t:'hi',name:coop.name||'익명'});tag();
  if(coop.host){closeM();['ovTitle','ovOver','ovRank'].forEach(hide);show('ovMode')}else{closeM();['ovTitle','ovOver','ovRank'].forEach(hide);$('waitMsg').textContent='친구가 난이도를 고르는 중…';show('ovWait')}});
 c.on('data',onData);c.on('close',lost);c.on('error',lost)}
function onData(d){if(!d||typeof d!=='object'||!coop)return;
 if(d.t==='hi'){coop.oppName=String(d.name||'친구').slice(0,8);tag();return}
 if(coop.host){if(d.t==='i'&&P[1]){P[1].tx=Math.max(12,Math.min(W-12,+d.x||0))}
  else if(d.t==='again'){coop.oppReady=true;againCheck()}return}
 // 친구 쪽
 if(d.t==='go'){hide('ovWait');hide('ovOver');countdown(()=>{mode=d.m;stage=1;score=0;tGame=0;snapA=snapB=null;myX=W*.66;lastSentX=-1;FX=[];state='play';$('field').classList.remove('dead');hide('ovRank');bgmStart();$('bPause').disabled=true;hud()},d.m,true);return}
 if(d.t==='s'){if(state==='play')applySnap(d);return}
 if(d.t==='over'){if(state!=='play')return;score=d.s;stage=d.st;state='over';bgmStop();sfx.over();$('field').classList.add('dead');setTimeout(showOver,1300);return}
 if(d.t==='again'){coop.oppReady=true;if(coop.meReady){$('waitMsg').textContent='친구가 난이도를 고르는 중…'}return}}
function countdown(go,m,guest){let n=3;const tick=()=>{if(!coop||!coop.conn||!coop.conn.open){closeM();return}if(n>0){modal(coop.oppName?'WITH '+esc(coop.oppName):'CO-OP',`<div class="phV-count">${n}</div><p class="phV-m">${MODEK[m]}</p>`,false);n--;setTimeout(tick,800)}else{closeM();coop.meReady=coop.oppReady=false;go()}};tick()}
function again(){if(!coop||!coop.conn||!coop.conn.open){toMenu();return}coop.meReady=true;send({t:'again'});hide('ovOver');
 if(coop.host)againCheck();else{$('waitMsg').textContent=coop.oppReady?'친구가 난이도를 고르는 중…':'친구를 기다리는 중…';show('ovWait')}}
function againCheck(){if(!coop.host)return;if(coop.meReady&&coop.oppReady){hide('ovWait');show('ovMode')}else if(coop.meReady){$('waitMsg').textContent='친구를 기다리는 중…';show('ovWait')}}
$('waitX').onclick=()=>{hide('ovWait');toMenu()};
function lost(){if(!coop)return;const wasHost=coop.host;tag();
 if(wasHost&&state==='play'){ // 방장은 혼자 계속
  const p=P[1];if(p){p.out=true;p.alive=false}banner={t:'SOLO',until:tGame+1.6};FX.push({txt:(coop.oppName||'친구')+'님이 나갔어요',x:W/2,y:H*.62,l:2.5,c:'#ff8aa0'});
  try{coop.peer&&coop.peer.destroy()}catch(e){}coop=null;tag();$('bPause').disabled=false;return}
 const inGame=state==='play';try{coop.peer&&coop.peer.destroy()}catch(e){}coop=null;tag();
 if(inGame){state='over';bgmStop()}
 ['ovWait','ovMode'].forEach(hide);modal('BYE',`<p class="phV-m">친구와 연결이 끊겼어요.</p><button class="phV-b" id="phVo">OK</button>`,false);$('phVo').onclick=()=>{closeM();toMenu()}}
function leaveCoop(silent){if(!coop)return;try{coop.conn&&coop.conn.open&&coop.conn.close()}catch(e){}try{coop.peer&&coop.peer.destroy()}catch(e){}coop=null;tag();if(!silent)closeM()}
$('bCoop').onclick=()=>{unlock();coopMenu()};
addEventListener('pagehide',()=>leaveCoop(true)); /* 창을 닫으면 친구에게 바로 알림 */

if(location.hash==='#test')window.__t={get state(){return state},get P(){return P},get E(){return E},get coop(){return coop},get score(){return score},get stage(){return stage},get lives(){return lives},startGame,step,setMyX,getMyX,snapshot};
resize();hud();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
